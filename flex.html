<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    .container{
        
    .container {
    display: grid;
    grid-auto-flow: column; /* default – items go in rows, one per row if you only have one column */
    grid-template-columns: 1fr; /* a single column layout */
}
        
}
    
    </style>
</head>
<body>
    <div class="container">
  <div>1</div>
  <div>2</div>
  <div>3</div>
</div>
</body>
</html>
